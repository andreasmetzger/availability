<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Andreas Metzger — Availability</title>

  <meta
    name="description"
    content="Current availability for Andreas Metzger."
  >

  <style>
    :root {
      --paper: #f8f5ef;
      --paper-deep: #f1ede5;
      --ink: #292824;
      --muted: #77736c;
      --rule: #d9d3c8;

      --blue: #cbd9e5;
      --rose: #e5d0d1;
      --sage: #d3ddce;
      --lilac: #d9d2e2;

      --busy: #cbd9e5;
      --busy-border: #aebfce;

      --hour-height: 64px;
      --time-width: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      color: var(--ink);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.24),
          rgba(255,255,255,0)
        ),
        var(--paper);

      font-family:
        "Avenir Next",
        Avenir,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 60px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 40px;

      padding-bottom: 28px;
      border-bottom: 1px solid var(--rule);
    }

    .identity {
      max-width: 620px;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Times New Roman",
        serif;

      font-size: clamp(38px, 5vw, 60px);
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: .98;
    }

    .subtitle {
      margin: 17px 0 0;

      color: var(--muted);
      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Times New Roman",
        serif;

      font-size: 17px;
      line-height: 1.5;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      border: 1px solid var(--busy-border);
      border-radius: 3px;
      background: var(--busy);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      margin: 28px 0 20px;
    }

    .controls-left {
      justify-self: start;
    }

    .controls-right {
      justify-self: end;
    }

    .week-title {
      text-align: center;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Times New Roman",
        serif;

      font-size: 19px;
    }

    .control-button {
      appearance: none;
      border: 1px solid var(--rule);
      border-radius: 999px;

      padding: 8px 14px;

      background: rgba(255,255,255,.28);
      color: var(--ink);

      cursor: pointer;

      font-size: 12px;

      transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease;
    }

    .control-button:hover {
      background: rgba(255,255,255,.65);
      border-color: #c7c0b4;
    }

    .control-button:active {
      transform: translateY(1px);
    }

    .calendar-shell {
      overflow: hidden;

      border: 1px solid var(--rule);
      border-radius: 13px;

      background: rgba(255,255,255,.19);

      box-shadow:
        0 18px 55px rgba(60, 53, 42, .045);
    }

    .calendar-scroll {
      overflow-x: auto;
    }

    .calendar {
      min-width: 900px;
    }

    .day-headings {
      display: grid;
      grid-template-columns:
        var(--time-width)
        repeat(7, 1fr);

      border-bottom: 1px solid var(--rule);
    }

    .time-heading {
      border-right: 1px solid var(--rule);
    }

    .day-heading {
      min-height: 76px;
      padding: 16px 8px 13px;

      border-right: 1px solid var(--rule);

      text-align: center;
    }

    .day-heading:last-child {
      border-right: 0;
    }

    .day-heading.today {
      background: rgba(211, 221, 206, .35);
    }

    .weekday {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .date-number {
      margin-top: 5px;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Times New Roman",
        serif;

      font-size: 24px;
    }

    .calendar-body {
      display: grid;
      grid-template-columns:
        var(--time-width)
        1fr;
    }

    .times {
      position: relative;
      height: calc(14 * var(--hour-height));

      border-right: 1px solid var(--rule);
    }

    .time-label {
      position: absolute;
      right: 10px;

      transform: translateY(-50%);

      color: #918c84;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .week-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);

      height: calc(14 * var(--hour-height));
    }

    .day-column {
      position: relative;

      border-right: 1px solid var(--rule);

      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(var(--hour-height) - 1px),
          rgba(217, 211, 200, .66) calc(var(--hour-height) - 1px),
          rgba(217, 211, 200, .66) var(--hour-height)
        );
    }

    .day-column:last-child {
      border-right: 0;
    }

    .day-column.today {
      background-color: rgba(211, 221, 206, .14);
    }

    .busy {
      position: absolute;
      left: 6px;
      right: 6px;

      min-height: 7px;

      overflow: hidden;

      border: 1px solid var(--busy-border);
      border-radius: 5px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.12),
          rgba(255,255,255,0)
        ),
        var(--busy);

      color: #46515a;

      padding: 5px 7px;

      font-size: 10px;
      line-height: 1.25;

      box-shadow:
        0 2px 7px rgba(65, 77, 87, .055);
    }

    .busy.short {
      padding-top: 2px;
      padding-bottom: 2px;
      font-size: 9px;
    }

    .busy-time {
      opacity: .76;
      font-variant-numeric: tabular-nums;
    }

    .status {
      min-height: 18px;
      margin-top: 16px;

      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 30px;

      margin-top: 38px;
      padding-top: 20px;

      border-top: 1px solid var(--rule);

      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .error {
      max-width: 600px;
      margin: 80px auto;

      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 24px, 1180px);
        padding-top: 38px;
      }

      header {
        display: block;
      }

      .legend {
        margin-top: 22px;
      }

      .controls {
        grid-template-columns: auto 1fr auto;
        gap: 8px;
      }

      .control-button {
        padding: 7px 10px;
      }

      .week-title {
        font-size: 15px;
      }

      footer {
        display: block;
      }

      footer div + div {
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header>
      <div class="identity">
        <p class="eyebrow">Availability</p>

        <h1>Andreas Metzger</h1>

        <p class="subtitle">
          My current availability. Unmarked periods are free.
        </p>
      </div>

      <div class="legend">
        <span class="legend-swatch"></span>
        <span>Unavailable</span>
      </div>
    </header>


    <section class="controls">
      <div class="controls-left">
        <button
          class="control-button"
          id="previousWeek"
          type="button"
          aria-label="Previous week"
        >
          ← Previous
        </button>
      </div>

      <div
        class="week-title"
        id="weekTitle"
      ></div>

      <div class="controls-right">
        <button
          class="control-button"
          id="nextWeek"
          type="button"
          aria-label="Next week"
        >
          Next →
        </button>
      </div>
    </section>


    <section
      class="calendar-shell"
      aria-label="Availability calendar"
    >
      <div class="calendar-scroll">
        <div class="calendar">

          <div
            class="day-headings"
            id="dayHeadings"
          ></div>

          <div class="calendar-body">

            <div
              class="times"
              id="times"
            ></div>

            <div
              class="week-grid"
              id="weekGrid"
            ></div>

          </div>

        </div>
      </div>
    </section>


    <div
      class="status"
      id="status"
    >
      Loading availability…
    </div>


    <footer>
      <div>
        Times shown in Europe/London.
      </div>

      <div>
        This page shows availability only; appointment details remain private.
      </div>
    </footer>

  </main>


  <script>
    /*
      ==========================================================
      SETTINGS
      ==========================================================
    */

    const DAY_START = 8;
    const DAY_END = 22;
    const HOUR_HEIGHT = 64;

    const TIME_ZONE = "Europe/London";

    let availabilityData = {
      busy: [],
      updated: null
    };

    let currentWeekStart = startOfWeek(new Date());


    /*
      ==========================================================
      DATE HELPERS
      ==========================================================
    */

    function startOfWeek(date) {
      const result = new Date(date);
      result.setHours(0, 0, 0, 0);

      const day = result.getDay();
      const difference = day === 0 ? -6 : 1 - day;

      result.setDate(result.getDate() + difference);

      return result;
    }


    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }


    function sameDay(a, b) {
      return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
      );
    }


    function formatTime(date) {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZone: TIME_ZONE
      }).format(date);
    }


    function formatWeekTitle(start) {
      const end = addDays(start, 6);

      const startMonth = new Intl.DateTimeFormat("en-GB", {
        month: "long"
      }).format(start);

      const endMonth = new Intl.DateTimeFormat("en-GB", {
        month: "long"
      }).format(end);

      const startYear = start.getFullYear();
      const endYear = end.getFullYear();

      if (
        start.getMonth() === end.getMonth() &&
        startYear === endYear
      ) {
        return `${start.getDate()}–${end.getDate()} ${startMonth} ${startYear}`;
      }

      if (startYear === endYear) {
        return (
          `${start.getDate()} ${startMonth} – ` +
          `${end.getDate()} ${endMonth} ${startYear}`
        );
      }

      return (
        `${start.getDate()} ${startMonth} ${startYear} – ` +
        `${end.getDate()} ${endMonth} ${endYear}`
      );
    }


    /*
      ==========================================================
      RENDERING
      ==========================================================
    */

    function render() {
      renderHeadings();
      renderTimes();
      renderWeek();
      renderStatus();
    }


    function renderHeadings() {
      const container = document.getElementById("dayHeadings");
      container.innerHTML = "";

      const blank = document.createElement("div");
      blank.className = "time-heading";
      container.appendChild(blank);

      const today = new Date();

      for (let i = 0; i < 7; i++) {
        const date = addDays(currentWeekStart, i);

        const heading = document.createElement("div");
        heading.className = "day-heading";

        if (sameDay(date, today)) {
          heading.classList.add("today");
        }

        const weekday = new Intl.DateTimeFormat("en-GB", {
          weekday: "short"
        }).format(date);

        heading.innerHTML = `
          <div class="weekday">${weekday}</div>
          <div class="date-number">${date.getDate()}</div>
        `;

        container.appendChild(heading);
      }

      document.getElementById("weekTitle").textContent =
        formatWeekTitle(currentWeekStart);
    }


    function renderTimes() {
      const container = document.getElementById("times");
      container.innerHTML = "";

      for (let hour = DAY_START; hour <= DAY_END; hour++) {
        const label = document.createElement("div");

        label.className = "time-label";
        label.style.top =
          `${(hour - DAY_START) * HOUR_HEIGHT}px`;

        label.textContent =
          `${String(hour).padStart(2, "0")}:00`;

        container.appendChild(label);
      }
    }


    function renderWeek() {
      const grid = document.getElementById("weekGrid");
      grid.innerHTML = "";

      const today = new Date();

      for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
        const date = addDays(currentWeekStart, dayIndex);

        const column = document.createElement("div");
        column.className = "day-column";

        if (sameDay(date, today)) {
          column.classList.add("today");
        }

        const events = eventsForDay(date);

        for (const event of events) {
          column.appendChild(createBusyBlock(event, date));
        }

        grid.appendChild(column);
      }
    }


    function eventsForDay(date) {
      const dayStart = new Date(date);
      dayStart.setHours(0, 0, 0, 0);

      const dayEnd = addDays(dayStart, 1);

      return availabilityData.busy
        .map(item => ({
          start: new Date(item.start),
          end: new Date(item.end)
        }))
        .filter(item =>
          item.start < dayEnd &&
          item.end > dayStart
        );
    }


    function createBusyBlock(event, dayDate) {
      const visibleStart = new Date(event.start);
      const visibleEnd = new Date(event.end);

      const dayStart = new Date(dayDate);
      dayStart.setHours(DAY_START, 0, 0, 0);

      const dayEnd = new Date(dayDate);
      dayEnd.setHours(DAY_END, 0, 0, 0);

      if (visibleStart < dayStart) {
        visibleStart.setTime(dayStart.getTime());
      }

      if (visibleEnd > dayEnd) {
        visibleEnd.setTime(dayEnd.getTime());
      }

      const startMinutes =
        (visibleStart.getHours() - DAY_START) * 60 +
        visibleStart.getMinutes();

      const endMinutes =
        (visibleEnd.getHours() - DAY_START) * 60 +
        visibleEnd.getMinutes();

      const top =
        (startMinutes / 60) * HOUR_HEIGHT;

      const height =
        ((endMinutes - startMinutes) / 60) * HOUR_HEIGHT;

      const block = document.createElement("div");

      block.className = "busy";

      if (height < 35) {
        block.classList.add("short");
      }

      block.style.top = `${top}px`;
      block.style.height = `${Math.max(height, 7)}px`;

      const originalStart = new Date(event.start);
      const originalEnd = new Date(event.end);

      block.innerHTML = `
        <div>Unavailable</div>
        <div class="busy-time">
          ${formatTime(originalStart)}–${formatTime(originalEnd)}
        </div>
      `;

      return block;
    }


    function renderStatus() {
      const status = document.getElementById("status");

      if (!availabilityData.updated) {
        status.textContent = "";
        return;
      }

      const updated = new Date(availabilityData.updated);

      const formatted =
        new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: TIME_ZONE
        }).format(updated);

      status.textContent =
        `Availability last updated ${formatted}.`;
    }


    /*
      ==========================================================
      LOAD DATA
      ==========================================================
    */

    async function loadAvailability() {
      try {
        const response = await fetch(
          `busy.json?v=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Could not load busy.json");
        }

        availabilityData = await response.json();

        if (!Array.isArray(availabilityData.busy)) {
          availabilityData.busy = [];
        }

        render();

      } catch (error) {
        console.error(error);

        document.getElementById("status").innerHTML =
          "Availability data is temporarily unavailable.";
      }
    }


    /*
      ==========================================================
      CONTROLS
      ==========================================================
    */

    document
      .getElementById("previousWeek")
      .addEventListener("click", () => {
        currentWeekStart =
          addDays(currentWeekStart, -7);

        render();
      });


    document
      .getElementById("nextWeek")
      .addEventListener("click", () => {
        currentWeekStart =
          addDays(currentWeekStart, 7);

        render();
      });


    /*
      ==========================================================
      START
      ==========================================================
    */

    loadAvailability();
  </script>

</body>
</html>
