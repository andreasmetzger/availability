<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Andreas Metzger — Availability</title>

<style>
:root {
    --paper: #f8f5ef;
    --ink: #292622;
    --muted: #77716a;
    --rule: #d8d1c6;

    --busy: #cbd9e5;
    --busy-border: #aabcca;

    --today: rgba(211, 221, 206, .22);

    /*
       24 hours must fit into the viewport.

       JS recalculates this on load, but this provides
       a sensible initial value.
    */
    --hour-height: 25px;
    --time-width: 54px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);

    font-family:
        Baskerville,
        "Baskerville Old Face",
        "Iowan Old Style",
        "Times New Roman",
        serif;

    -webkit-font-smoothing: antialiased;
}

button,
select,
option {
    font: inherit;
}

body {
    overflow-x: hidden;
}

.page {
    width: min(1500px, calc(100% - 48px));
    margin: 0 auto;
    padding: 22px 0 18px;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 30px;

    padding-bottom: 13px;
    border-bottom: 1px solid var(--rule);
}

.eyebrow {
    margin: 0 0 3px;

    color: var(--muted);
    font-size: 10px;
    letter-spacing: .17em;
    text-transform: uppercase;
}

h1 {
    margin: 0;

    font-size: clamp(29px, 3.1vw, 44px);
    font-weight: 400;
    letter-spacing: -.015em;
    line-height: 1;
}

.header-right {
    display: flex;
    align-items: flex-end;
    gap: 26px;
}

.legend {
    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);
    font-size: 11px;
}

.legend-swatch {
    width: 15px;
    height: 10px;

    border: 1px solid var(--busy-border);
    background: var(--busy);
}


/* =========================================================
   TIME ZONE
   ========================================================= */

.timezone-control {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.timezone-control label {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: .11em;
    text-transform: uppercase;
}

.timezone-control select {
    min-width: 185px;

    padding: 4px 25px 4px 7px;

    border: 1px solid var(--rule);
    border-radius: 0;

    background: transparent;
    color: var(--ink);

    font-size: 11px;

    appearance: auto;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;

    margin: 10px 0;
}

.controls-left {
    justify-self: start;
}

.controls-right {
    justify-self: end;
}

.week-title {
    font-size: 16px;
    text-align: center;
}

.control-button {
    appearance: none;

    padding: 4px 9px;

    border: 1px solid var(--rule);
    border-radius: 0;

    background: transparent;
    color: var(--ink);

    cursor: pointer;

    font-size: 11px;
}

.control-button:hover {
    background: rgba(255,255,255,.35);
}


/* =========================================================
   CALENDAR
   ========================================================= */

.calendar-shell {
    overflow: hidden;

    border: 1px solid var(--rule);
    border-radius: 0;

    background: rgba(255,255,255,.12);
}

.calendar {
    width: 100%;
    min-width: 760px;
}


/* =========================================================
   DAY HEADINGS
   ========================================================= */

.day-headings {
    display: grid;

    grid-template-columns:
        var(--time-width)
        repeat(7, 1fr);

    border-bottom: 1px solid var(--rule);
}

.time-heading {
    border-right: 1px solid var(--rule);
}

.day-heading {
    height: 42px;
    padding: 6px 5px;

    border-right: 1px solid var(--rule);

    text-align: center;
}

.day-heading:last-child {
    border-right: 0;
}

.day-heading.today {
    background: var(--today);
}

.weekday {
    color: var(--muted);

    font-size: 8px;
    letter-spacing: .13em;
    text-transform: uppercase;
}

.date-number {
    margin-top: 1px;

    font-size: 18px;
    line-height: 1;
}


/* =========================================================
   BODY
   ========================================================= */

.calendar-body {
    display: grid;
    grid-template-columns: var(--time-width) 1fr;
}

.times {
    position: relative;

    height: calc(24 * var(--hour-height));

    border-right: 1px solid var(--rule);
}

.time-label {
    position: absolute;
    right: 7px;

    transform: translateY(-50%);

    color: #8d877f;

    font-size: 8px;
    font-variant-numeric: tabular-nums;
}

.week-grid {
    position: relative;

    display: grid;
    grid-template-columns: repeat(7, 1fr);

    height: calc(24 * var(--hour-height));
}

.day-column {
    position: relative;

    border-right: 1px solid var(--rule);

    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent calc(var(--hour-height) - 1px),
            rgba(216, 209, 198, .55)
                calc(var(--hour-height) - 1px),
            rgba(216, 209, 198, .55)
                var(--hour-height)
        );
}

.day-column:last-child {
    border-right: 0;
}

.day-column.today {
    background-color: var(--today);
}


/* =========================================================
   BUSY BLOCKS
   ========================================================= */

.busy {
    position: absolute;

    left: 3px;
    right: 3px;

    overflow: hidden;

    border: 1px solid var(--busy-border);
    border-radius: 0;

    background: var(--busy);

    color: #45515a;

    padding: 2px 4px;

    font-size: 8px;
    line-height: 1.05;
}

.busy-time {
    opacity: .8;
    font-variant-numeric: tabular-nums;
}


/* =========================================================
   FOOTER
   ========================================================= */

.status {
    min-height: 12px;

    margin-top: 5px;

    color: var(--muted);

    font-size: 9px;
    text-align: right;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 800px) {

    .page {
        width: calc(100% - 20px);
        padding-top: 14px;
    }

    header {
        align-items: flex-start;
    }

    .header-right {
        display: block;
    }

    .legend {
        margin-bottom: 7px;
    }

    .timezone-control select {
        min-width: 150px;
    }

    .calendar-shell {
        overflow-x: auto;
    }

    .calendar {
        min-width: 760px;
    }
}
</style>
</head>


<body>

<main class="page">

<header>

    <div>
        <p class="eyebrow">Availability</p>
        <h1>Andreas Metzger</h1>
    </div>

    <div class="header-right">

        <div class="legend">
            <span class="legend-swatch"></span>
            <span>Unavailable</span>
        </div>

        <div class="timezone-control">

            <label for="timezone">
                Time zone
            </label>

            <select id="timezone">

                <option value="Europe/London">
                    London
                </option>

                <option value="Europe/Paris">
                    Paris / Berlin
                </option>

                <option value="Europe/Zurich">
                    Zurich
                </option>

                <option value="America/New_York">
                    New York
                </option>

                <option value="America/Chicago">
                    Chicago
                </option>

                <option value="America/Los_Angeles">
                    Los Angeles
                </option>

                <option value="Asia/Hong_Kong">
                    Hong Kong
                </option>

                <option value="Asia/Singapore">
                    Singapore
                </option>

                <option value="Asia/Tokyo">
                    Tokyo
                </option>

                <option value="Australia/Sydney">
                    Sydney
                </option>

            </select>

        </div>

    </div>

</header>


<section class="controls">

    <div class="controls-left">

        <button
            class="control-button"
            id="previousWeek"
            type="button"
        >
            ← Previous
        </button>

    </div>


    <div
        class="week-title"
        id="weekTitle"
    ></div>


    <div class="controls-right">

        <button
            class="control-button"
            id="todayButton"
            type="button"
        >
            Today
        </button>

        <button
            class="control-button"
            id="nextWeek"
            type="button"
        >
            Next →
        </button>

    </div>

</section>


<section class="calendar-shell">

    <div class="calendar">

        <div
            class="day-headings"
            id="dayHeadings"
        ></div>


        <div class="calendar-body">

            <div
                class="times"
                id="times"
            ></div>

            <div
                class="week-grid"
                id="weekGrid"
            ></div>

        </div>

    </div>

</section>


<div
    class="status"
    id="status"
>
    Loading availability…
</div>

</main>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

const DAY_START = 0;
const DAY_END = 24;

let selectedTimeZone =
    Intl.DateTimeFormat().resolvedOptions().timeZone
    || "Europe/London";

let availabilityData = {
    busy: [],
    updated: null
};

let currentWeekStart;


/* ============================================================
   TIME-ZONE UTILITIES
   ============================================================ */

function partsInZone(date, timeZone) {

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }
        ).formatToParts(date);

    const result = {};

    for (const part of parts) {
        if (part.type !== "literal") {
            result[part.type] = part.value;
        }
    }

    return {
        year: Number(result.year),
        month: Number(result.month),
        day: Number(result.day),
        hour: Number(result.hour) % 24,
        minute: Number(result.minute)
    };
}


function zonedDateKey(date) {

    const p = partsInZone(
        date,
        selectedTimeZone
    );

    return (
        `${p.year}-` +
        `${String(p.month).padStart(2, "0")}-` +
        `${String(p.day).padStart(2, "0")}`
    );
}


function localDateKey(date) {

    return (
        `${date.getFullYear()}-` +
        `${String(date.getMonth() + 1).padStart(2, "0")}-` +
        `${String(date.getDate()).padStart(2, "0")}`
    );
}


/*
   The week-navigation dates here are deliberately
   calendar dates rather than absolute instants.
*/

function startOfWeek(date) {

    const result = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const day = result.getDay();

    result.setDate(
        result.getDate() +
        (day === 0 ? -6 : 1 - day)
    );

    return result;
}


function addDays(date, amount) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate() + amount
    );
}


/* ============================================================
   DISPLAY FORMATTING
   ============================================================ */

function formatTime(date) {

    return new Intl.DateTimeFormat(
        "en-GB",
        {
            timeZone: selectedTimeZone,
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    ).format(date);
}


function formatWeekTitle(start) {

    const end = addDays(start, 6);

    const startMonth =
        new Intl.DateTimeFormat(
            "en-GB",
            { month: "long" }
        ).format(start);

    const endMonth =
        new Intl.DateTimeFormat(
            "en-GB",
            { month: "long" }
        ).format(end);

    if (
        start.getMonth() === end.getMonth() &&
        start.getFullYear() === end.getFullYear()
    ) {

        return (
            `${start.getDate()}–${end.getDate()} ` +
            `${startMonth} ${start.getFullYear()}`
        );
    }

    if (
        start.getFullYear() === end.getFullYear()
    ) {

        return (
            `${start.getDate()} ${startMonth} – ` +
            `${end.getDate()} ${endMonth} ` +
            `${start.getFullYear()}`
        );
    }

    return (
        `${start.getDate()} ${startMonth} ` +
        `${start.getFullYear()} – ` +
        `${end.getDate()} ${endMonth} ` +
        `${end.getFullYear()}`
    );
}


/* ============================================================
   FIT ENTIRE 24-HOUR DAY INTO INITIAL VIEWPORT
   ============================================================ */

function fitCalendarToViewport() {

    const page =
        document.querySelector(".page");

    const shell =
        document.querySelector(".calendar-shell");

    const headings =
        document.querySelector(".day-headings");

    const status =
        document.querySelector(".status");

    /*
       Work out how much vertical space is available
       after the calendar begins.
    */

    const shellTop =
        shell.getBoundingClientRect().top;

    const statusHeight =
        status.offsetHeight + 12;

    const availableHeight =
        window.innerHeight -
        shellTop -
        statusHeight -
        8;

    const headingHeight =
        headings.offsetHeight;

    const gridHeight =
        Math.max(
            360,
            availableHeight - headingHeight
        );

    const hourHeight =
        gridHeight / 24;

    document.documentElement.style.setProperty(
        "--hour-height",
        `${hourHeight}px`
    );
}


/* ============================================================
   CURRENT WEEK IN SELECTED TIME ZONE
   ============================================================ */

function resetToCurrentWeek() {

    const now = new Date();

    const p =
        partsInZone(
            now,
            selectedTimeZone
        );

    const selectedZoneToday =
        new Date(
            p.year,
            p.month - 1,
            p.day
        );

    currentWeekStart =
        startOfWeek(selectedZoneToday);
}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

    renderHeadings();
    renderTimes();
    renderWeek();
    renderStatus();

    requestAnimationFrame(
        fitCalendarToViewport
    );
}


/* ============================================================
   HEADINGS
   ============================================================ */

function renderHeadings() {

    const container =
        document.getElementById(
            "dayHeadings"
        );

    container.innerHTML = "";


    const blank =
        document.createElement("div");

    blank.className =
        "time-heading";

    container.appendChild(blank);


    const now =
        new Date();

    const todayKey =
        zonedDateKey(now);


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            addDays(
                currentWeekStart,
                i
            );

        const heading =
            document.createElement("div");

        heading.className =
            "day-heading";


        if (
            localDateKey(date) ===
            todayKey
        ) {

            heading.classList.add(
                "today"
            );
        }


        const weekday =
            new Intl.DateTimeFormat(
                "en-GB",
                {
                    weekday: "short"
                }
            ).format(date);


        heading.innerHTML = `
            <div class="weekday">
                ${weekday}
            </div>

            <div class="date-number">
                ${date.getDate()}
            </div>
        `;


        container.appendChild(
            heading
        );
    }


    document.getElementById(
        "weekTitle"
    ).textContent =
        formatWeekTitle(
            currentWeekStart
        );
}


/* ============================================================
   24-HOUR SCALE
   ============================================================ */

function renderTimes() {

    const container =
        document.getElementById(
            "times"
        );

    container.innerHTML = "";


    for (
        let hour = 0;
        hour <= 24;
        hour++
    ) {

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "time-label";

        label.style.top =
            `calc(${hour} * var(--hour-height))`;

        label.textContent =
            hour === 24
                ? "24:00"
                : `${String(hour).padStart(2, "0")}:00`;

        container.appendChild(
            label
        );
    }
}


/* ============================================================
   EVENTS FOR A PARTICULAR DISPLAYED DATE
   ============================================================ */

function eventsForDate(date) {

    const targetKey =
        localDateKey(date);

    const pieces = [];


    for (
        const item of availabilityData.busy
    ) {

        const start =
            new Date(item.start);

        const end =
            new Date(item.end);


        /*
           Walk through the interval in small logical
           pieces where necessary.

           For ordinary appointments this executes once.
        */

        const startParts =
            partsInZone(
                start,
                selectedTimeZone
            );

        const endProbe =
            new Date(
                end.getTime() - 1
            );

        const endParts =
            partsInZone(
                endProbe,
                selectedTimeZone
            );


        const startKey =
            `${startParts.year}-` +
            `${String(startParts.month).padStart(2, "0")}-` +
            `${String(startParts.day).padStart(2, "0")}`;

        const endKey =
            `${endParts.year}-` +
            `${String(endParts.month).padStart(2, "0")}-` +
            `${String(endParts.day).padStart(2, "0")}`;


        /*
           Normal same-day event
        */

        if (
            startKey === targetKey &&
            endKey === targetKey
        ) {

            pieces.push({
                start,
                end,
                startMinute:
                    startParts.hour * 60 +
                    startParts.minute,

                endMinute:
                    (
                        partsInZone(
                            end,
                            selectedTimeZone
                        ).hour * 60
                    ) +
                    partsInZone(
                        end,
                        selectedTimeZone
                    ).minute
            });

            continue;
        }


        /*
           Begins on this day and continues
           beyond midnight.
        */

        if (
            startKey === targetKey
        ) {

            pieces.push({
                start,
                end,
                startMinute:
                    startParts.hour * 60 +
                    startParts.minute,

                endMinute: 1440
            });

            continue;
        }


        /*
           Ends on this day after beginning
           on an earlier date.
        */

        if (
            endKey === targetKey
        ) {

            const ep =
                partsInZone(
                    end,
                    selectedTimeZone
                );

            pieces.push({
                start,
                end,
                startMinute: 0,
                endMinute:
                    ep.hour * 60 +
                    ep.minute
            });

            continue;
        }
    }


    return pieces;
}


/* ============================================================
   WEEK GRID
   ============================================================ */

function renderWeek() {

    const grid =
        document.getElementById(
            "weekGrid"
        );

    grid.innerHTML = "";


    const todayKey =
        zonedDateKey(
            new Date()
        );


    for (
        let dayIndex = 0;
        dayIndex < 7;
        dayIndex++
    ) {

        const date =
            addDays(
                currentWeekStart,
                dayIndex
            );


        const column =
            document.createElement(
                "div"
            );

        column.className =
            "day-column";


        if (
            localDateKey(date) ===
            todayKey
        ) {

            column.classList.add(
                "today"
            );
        }


        const events =
            eventsForDate(date);


        for (
            const event of events
        ) {

            column.appendChild(
                createBusyBlock(
                    event
                )
            );
        }


        grid.appendChild(
            column
        );
    }
}


/* ============================================================
   BUSY BLOCK
   ============================================================ */

function createBusyBlock(event) {

    const block =
        document.createElement(
            "div"
        );

    block.className =
        "busy";


    const topHours =
        event.startMinute / 60;

    const durationHours =
        (
            event.endMinute -
            event.startMinute
        ) / 60;


    block.style.top =
        `calc(${topHours} * var(--hour-height))`;

    block.style.height =
        `calc(${durationHours} * var(--hour-height))`;


    /*
       On very short appointments there is not enough
       space for text, so leave the block unlabelled.
    */

    if (
        event.endMinute -
        event.startMinute >= 35
    ) {

        block.innerHTML = `
            <div>
                Unavailable
            </div>

            <div class="busy-time">
                ${formatTime(event.start)}–${formatTime(event.end)}
            </div>
        `;
    }


    return block;
}


/* ============================================================
   STATUS
   ============================================================ */

function renderStatus() {

    const status =
        document.getElementById(
            "status"
        );


    if (
        !availabilityData.updated
    ) {

        status.textContent =
            `Time zone: ${selectedTimeZone}`;

        return;
    }


    const updated =
        new Date(
            availabilityData.updated
        );


    const formatted =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                day: "numeric",
                month: "long",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
                timeZone: selectedTimeZone
            }
        ).format(updated);


    status.textContent =
        `Time zone: ${selectedTimeZone} · ` +
        `Updated ${formatted}`;
}


/* ============================================================
   LOAD BUSY DATA
   ============================================================ */

async function loadAvailability() {

    try {

        const response =
            await fetch(
                `busy.json?v=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            throw new Error(
                "Could not load busy.json"
            );
        }


        availabilityData =
            await response.json();


        if (
            !Array.isArray(
                availabilityData.busy
            )
        ) {

            availabilityData.busy = [];
        }


        render();

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "Availability data is temporarily unavailable.";
    }
}


/* ============================================================
   TIME-ZONE SELECTOR
   ============================================================ */

const timezoneSelect =
    document.getElementById(
        "timezone"
    );


/*
   If visitor's own zone is one of our options,
   select it automatically.

   Otherwise default to London.
*/

const supportedZones =
    Array.from(
        timezoneSelect.options
    ).map(
        option => option.value
    );


if (
    supportedZones.includes(
        selectedTimeZone
    )
) {

    timezoneSelect.value =
        selectedTimeZone;

}

else {

    selectedTimeZone =
        "Europe/London";

    timezoneSelect.value =
        selectedTimeZone;
}


timezoneSelect.addEventListener(
    "change",
    () => {

        selectedTimeZone =
            timezoneSelect.value;

        resetToCurrentWeek();

        render();
    }
);


/* ============================================================
   NAVIGATION
   ============================================================ */

document.getElementById(
    "previousWeek"
).addEventListener(
    "click",
    () => {

        currentWeekStart =
            addDays(
                currentWeekStart,
                -7
            );

        render();
    }
);


document.getElementById(
    "nextWeek"
).addEventListener(
    "click",
    () => {

        currentWeekStart =
            addDays(
                currentWeekStart,
                7
            );

        render();
    }
);


document.getElementById(
    "todayButton"
).addEventListener(
    "click",
    () => {

        resetToCurrentWeek();

        render();
    }
);


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(
            fitCalendarToViewport
        );
    }
);


/* ============================================================
   INITIALISE
   ============================================================ */

resetToCurrentWeek();

loadAvailability();

</script>

</body>
</html>
